name: app_botonera
description: "SensePad - app de la botonera"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Versiones exactas recuperadas del APK que usaban los chicos.
dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: 1.36.8
  flutter_foreground_task: 8.10.4
  http: 1.6.0
  url_launcher: 6.3.2
  flutter_tts: 4.2.5
  wakelock_plus: 1.6.1
  permission_handler: 11.4.0
  shared_preferences: 2.5.5
  geolocator: 14.0.3
  flutter_phone_direct_caller: 2.2.1
  google_fonts: 6.3.3
  google_sign_in: 7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logoSensepad.png
